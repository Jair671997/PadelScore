
name: PadelScore - Build watchOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'watchOS/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build Apple Watch app
    runs-on: macos-15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: watchOS
        run: xcodegen generate --spec project.yml

      - name: Build for Apple Watch simulator
        working-directory: watchOS
        run: |
          xcodebuild \
            -project PadelScore.xcodeproj \
            -scheme PadelScore \
            -sdk watchsimulator \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: PadelScore-watchOS-simulator
          path: watchOS/build/Build/Products/Debug-watchsimulator/PadelScore.app
