
name: PadelScore - Build watchOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'watchOS/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Generate and build Apple Watch app
    runs-on: macos-15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: watchOS
        run: xcodegen generate --spec project.yml

      - name: Build for Apple Watch Simulator
        run: |
          xcodebuild \
            -project watchOS/PadelScore.xcodeproj \
            -scheme PadelScore \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
